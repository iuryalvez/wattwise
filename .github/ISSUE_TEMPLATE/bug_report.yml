name: Bug report
description: Report a reproducible problem in WattWise.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve WattWise. English and Portuguese are welcome.
        Search existing issues first and use fictional or redacted data.
        For vulnerabilities, follow [SECURITY.md](https://github.com/rafaelsilvabr/wattwise/blob/main/SECURITY.md) instead of posting technical details here.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page, example profile or minimal fictional inputs, and the action that triggers the problem.
      placeholder: |
        1. Start the app with ...
        2. Load the ... example
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your commit or release, operating system, Python version, and browser. Add Node, Ollama, and model versions if relevant.
      placeholder: |
        Commit or release:
        Operating system:
        Python:
        Browser:
        Node / Ollama / model, if relevant:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional. Remove secrets, personal routines, device identifiers, and other private data before sharing.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal information from this report.
          required: true
